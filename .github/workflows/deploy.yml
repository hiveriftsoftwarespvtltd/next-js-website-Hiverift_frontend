name: Deploy to hiverift.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          cd /home/hiverift0805/nextjs_app

          git pull origin main
          npm install
          npm run build

          # Reload or Start Next.js with PM2 on port 3002
          pm2 reload hiverift || pm2 restart hiverift || pm2 start npm --name "hiverift" -- run start:prod || sudo /bin/pm2 reload hiverift || sudo /bin/pm2 restart hiverift || sudo /bin/pm2 start npm --name "hiverift" -- run start:prod
          pm2 save || sudo /bin/pm2 save
